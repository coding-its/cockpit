[package]
name = "wartungscockpit-desktop"
version = "0.1.14"
edition = "2021"
description = "Wartungscockpit als Windows-Anwendung"
license = "MIT"
publish = false

[lib]
name = "wartungscockpit_desktop"
path = "src/lib.rs"

[[bin]]
name = "wartungscockpit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
wartungscockpit-api = { path = "../../api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
opt-level = "s"
lto = true
strip = true
